<svg xmlns="http://www.w3.org/2000/svg" width="560" height="390" viewBox="0 0 560 390" fill="none">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00d9ff"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#ff2e88"/>
    </linearGradient>
    <style>
      text { font-family: 'Fira Code', 'JetBrains Mono', Consolas, 'Courier New', monospace; font-size: 15px; }
      .p { fill: #39ff14; } .h { fill: #00d9ff; } .c { fill: #c9d1d9; } .o { fill: #8b949e; }
      .ok { fill: #39ff14; } .w { fill: #ffbd2e; } .k { fill: #ff7ab5; }
