<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="12" viewBox="0 0 1200 12" fill="none">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00d9ff" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#00d9ff"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="0.8" stop-color="#ff2e88"/>
      <stop offset="1" stop-color="#ff2e88" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="g" x="-10%" y="-200%" width="120%" height="500%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect x="0" y="5" width="1200" height="2" rx="1" fill="url(#line)" filter="url(#g)"/>
  <rect x="0" y="5" width="1200" height="2" rx="1" fill="url(#line)"/>
  <rect x="-160" y="4" width="160" height="4" rx="2" fill="url(#shine)">
    <animate attributeName="x" values="-160;1200" dur="3.5s" repeatCount="indefinite"/>
  </rect>
  <circle cx="600" cy="6" r="4" fill="#7c3aed"/>
  <circle cx="600" cy="6" r="2" fill="#ffffff"/>
</svg>
