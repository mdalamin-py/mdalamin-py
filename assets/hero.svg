<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.55" stop-color="#0a1128"/>
      <stop offset="1" stop-color="#120a2a"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d9ff"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#ff2e88"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.3 0; 0.3 0; -0.3 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.15" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#00d9ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00d9ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.85" cy="0.8" r="0.6">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d9ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#00d9ff" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00d9ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#00d9ff" stop-opacity="0.35"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#00d9ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="radarClip"><circle cx="960" cy="190" r="130"/></clipPath>
    <style>
      .mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, 'Courier New', monospace; }
      .sans { font-family: 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; }
      .fade1 { animation: up .9s ease-out .1s both; }
      .fade2 { animation: up .9s ease-out .5s both; }
      .fade3 { animation: up .9s ease-out .9s both; }
      .fade4 { animation: up .9s ease-out 1.3s both; }
      .fade5 { animation: up .9s ease-out 1.7s both; }
      @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .blip { animation: ping 3s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      .blip.b2 { animation-delay: 1s; } .blip.b3 { animation-delay: 2s; }
      @keyframes ping { 0% { opacity: 0; transform: scale(.4); } 15% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.6); } }
      .float { animation: float 6s ease-in-out infinite; }
      .float.f2 { animation-duration: 8s; animation-delay: 1s; }
      .float.f3 { animation-duration: 7s; animation-delay: 2s; }
      @keyframes float { 0%,100% { transform: translateY(0); opacity: .25; } 50% { transform: translateY(-14px); opacity: .9; } }
    </style>
  </defs>

  <!-- background -->
  <rect width="1200" height="380" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="380" rx="18" fill="url(#glowL)"/>
  <rect width="1200" height="380" rx="18" fill="url(#glowR)"/>

  <!-- floating particles -->
  <g fill="#00d9ff">
    <circle class="float" cx="30" cy="190" r="2"/>
    <circle class="float f2" cx="300" cy="60" r="1.6"/>
    <circle class="float f3" cx="740" cy="340" r="2.2"/>
    <circle class="float" cx="700" cy="70" r="1.4" fill="#ff2e88"/>
    <circle class="float f2" cx="1150" cy="330" r="2" fill="#7c3aed"/>
    <circle class="float f3" cx="1120" cy="50" r="1.6"/>
  </g>

  <!-- left: identity -->
  <g class="mono fade1">
    <text x="70" y="92" font-size="18" fill="#00d9ff" fill-opacity="0.85">&lt;hello world /&gt;</text>
  </g>
  <g class="sans fade2" filter="url(#glow)">
    <text x="66" y="168" font-size="76" font-weight="800" letter-spacing="2" fill="url(#name)">MD AL AMIN</text>
  </g>
  <g class="sans fade3">
    <text x="70" y="212" font-size="22" font-weight="500" fill="#c9d1d9">
      Full-Stack Developer <tspan fill="#7c3aed">◆</tspan> Ethical Hacker <tspan fill="#ff2e88">◆</tspan> Malware Analyst
    </text>
  </g>

  <!-- terminal line -->
  <g class="mono fade4">
    <rect x="70" y="240" width="560" height="44" rx="10" fill="#0d1117" stroke="#00d9ff" stroke-opacity="0.35"/>
    <text x="90" y="268" font-size="17" fill="#39ff14">alamin@kali</text>
    <text x="193" y="268" font-size="17" fill="#c9d1d9">:</text>
    <text x="202" y="268" font-size="17" fill="#00d9ff">~</text>
    <text x="213" y="268" font-size="17" fill="#c9d1d9">$ ./build --secure --scalable</text>
    <rect class="cursor" x="492" y="254" width="10" height="19" fill="#39ff14"/>
  </g>

  <!-- chips -->
  <g class="mono fade5" font-size="14">
    <rect x="70" y="304" width="118" height="32" rx="16" fill="#00d9ff" fill-opacity="0.1" stroke="#00d9ff" stroke-opacity="0.6"/>
    <text x="129" y="325" text-anchor="middle" fill="#00d9ff">Python</text>
    <rect x="198" y="304" width="118" height="32" rx="16" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-opacity="0.8"/>
    <text x="257" y="325" text-anchor="middle" fill="#b794f6">Django</text>
    <rect x="326" y="304" width="118" height="32" rx="16" fill="#00d9ff" fill-opacity="0.1" stroke="#00d9ff" stroke-opacity="0.6"/>
    <text x="385" y="325" text-anchor="middle" fill="#00d9ff">React</text>
    <rect x="454" y="304" width="176" height="32" rx="16" fill="#ff2e88" fill-opacity="0.1" stroke="#ff2e88" stroke-opacity="0.7"/>
    <text x="542" y="325" text-anchor="middle" fill="#ff7ab5">Cybersecurity</text>
  </g>

  <!-- right: radar -->
  <g>
    <circle cx="960" cy="190" r="130" fill="#00d9ff" fill-opacity="0.03" stroke="#00d9ff" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle cx="960" cy="190" r="95" stroke="#00d9ff" stroke-opacity="0.22"/>
    <circle cx="960" cy="190" r="60" stroke="#00d9ff" stroke-opacity="0.22"/>
    <circle cx="960" cy="190" r="25" stroke="#00d9ff" stroke-opacity="0.22"/>
    <path d="M830 190H1090M960 60V320" stroke="#00d9ff" stroke-opacity="0.15"/>
    <g clip-path="url(#radarClip)">
      <path d="M960 190 L1090 190 A130 130 0 0 0 1052 98 Z" fill="url(#sweep)">
        <animateTransform attributeName="transform" type="rotate" from="0 960 190" to="360 960 190" dur="4s" repeatCount="indefinite"/>
      </path>
    </g>
    <g filter="url(#soft)">
      <circle class="blip" cx="1015" cy="140" r="5" fill="#ff2e88"/>
      <circle class="blip b2" cx="905" cy="240" r="4" fill="#39ff14"/>
      <circle class="blip b3" cx="1030" cy="250" r="4" fill="#00d9ff"/>
    </g>
    <!-- shield -->
    <g filter="url(#soft)">
      <path d="M960 160 L984 170 V190 C984 205 973 216 960 221 C947 216 936 205 936 190 V170 Z" fill="#0d1117" stroke="#00d9ff" stroke-width="2"/>
      <path d="M950 190 l7 7 l13 -14" stroke="#39ff14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
    <text class="mono" x="960" y="350" font-size="13" text-anchor="middle" fill="#00d9ff" fill-opacity="0.7" letter-spacing="3">THREAT SCAN · ACTIVE</text>
  </g>

  <!-- scan line -->
  <rect x="0" y="-60" width="1200" height="60" fill="url(#scan)" opacity="0.35">
    <animate attributeName="y" values="-60;380" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- border -->
  <rect x="1" y="1" width="1198" height="378" rx="17" stroke="url(#name)" stroke-opacity="0.6" stroke-width="2"/>
</svg>
